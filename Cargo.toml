[package]
name = "saddle-camera-rts-camera"
version = "0.1.0"
edition = "2024"
publish = false
description = "Reusable RTS pan, zoom, rotate, and terrain-follow camera for Bevy"
repository = "https://github.com/julien-blanchon/saddle-camera-rts-camera"
license = "MIT-0"

[dependencies]
bevy = { version = "0.18", features = ["serialize"] }

[workspace]

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"
