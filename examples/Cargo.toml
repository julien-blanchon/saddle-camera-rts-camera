[workspace]
members = [
    "common",
    "basic",
    "bookmarks",
    "terrain_follow",
    "cursor_zoom",
    "bounds",
    "follow_target",
    "headless",
    "enhanced_input",
    "lab",
]
resolver = "3"

[workspace.dependencies]
bevy = { version = "0.18", features = ["serialize"] }
bevy_enhanced_input = "0.24"
saddle-camera-rts-camera = { path = ".." }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"
